map $uri $class_a_bridge_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 443 ssl http2;
    server_name bridge.classabridge.ancilis.com;

    ssl_certificate /etc/letsencrypt/live/bridge.classabridge.ancilis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.classabridge.ancilis.com/privkey.pem;

    root /srv/class-a-bridge/bridge;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; manifest-src 'self'; media-src 'none'; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;
    add_header Cache-Control $class_a_bridge_cache_control always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Service-Worker-Allowed "/" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /index.html {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name bridge.classabridge.ancilis.com;
    return 308 https://bridge.classabridge.ancilis.com$request_uri;
}
